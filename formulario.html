<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPQD 360 - Compartilhe Conosco</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: var(--cpqd-green-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        .form-container {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        .form-container h1 {
            color: var(--cpqd-green-dark);
            margin-bottom: 10px;
            font-size: 24px;
        }

        .form-container p {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: bold;
            font-size: 13px;
            color: #333;
        }

        .form-group input, .form-group textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--color-teal);
        }

        .submit-btn {
            background-color: var(--color-teal);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: #00897B;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
        }

        /* ESTILO DO POPUP (MODAL DE SUCESSO) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease-in-out;
        }

        .modal-card h3 {
            color: #00796B;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .modal-card p {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-btn {
            background-color: #00BFA5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Entre em Contato</h1>
        <p>Quer compartilhar algo conosco? Preencha o formulário abaixo.</p>

        <!-- SUBMIT INTERCEPTADO VIA JAVASCRIPT -->
        <form id="feedbackForm" action="https://script.google.com/a/macros/cpqd.com.br/s/AKfycbygdDjvnPZEvGytcTIodQyevFv59VD6e3-CmrMZgJrIBMgYpBnCySLfu-ehUGzloMzSpQ/exec" method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@cpqd.com" required>
            </div>

            <div class="form-group">
                <label for="mensagem">Sua Mensagem / Sugestão</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva aqui..." required></textarea>
            </div>

            <button type="submit" id="btnSubmit" class="submit-btn">Enviar Mensagem</button>
        </form>

        <a href="index.html" class="back-link">← Voltar para o Mapa</a>
    </div>

    <!-- MODAL DE SUCESSO -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-card">
            <h3>Mensagem Enviada!</h3>
            <p>Obrigado pelo seu feedback. Nossa equipe irá analisar a sua contribuição.</p>
            <button class="modal-btn" onclick="closeModal()">Fechar</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/a/macros/cpqd.com.br/s/AKfycbygdDjvnPZEvGytcTIodQyevFv59VD6e3-CmrMZgJrIBMgYpBnCySLfu-ehUGzloMzSpQ/exec";

        const form = document.getElementById('feedbackForm');
        const modal = document.getElementById('successModal');
        const btnSubmit = document.getElementById('btnSubmit');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            btnSubmit.innerText = "Enviando...";
            btnSubmit.disabled = true;

            const formData = new FormData(form);

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData,
                mode: 'no-cors'
            })
            .then(() => {
                modal.style.display = 'flex';
                form.reset();
            })
            .catch(err => {
                alert("Ocorreu um erro ao enviar. Tente novamente.");
            })
            .finally(() => {
                btnSubmit.innerText = "Enviar Mensagem";
                btnSubmit.disabled = false;
            });
        });

        function closeModal() {
            modal.style.display = 'none';
        }
// Agora o formulário envia nativamente via POST sem depender de JS complexo
    const modal = document.getElementById('successModal');

    function closeModal() {
        modal.style.display = 'none';
    }
</script>
</body>
</html>
