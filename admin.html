<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pólis CPQD - Acesso Restrito Parceiros</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: var(--cpqd-green-light);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }

        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 35px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid #E5E7EB;
            text-align: center;
        }

        .login-card .logo-cpqd {
            height: 38px;
            margin: 0 auto 15px auto;
        }

        .login-card h2 {
            font-size: 20px;
            color: #111827;
            margin-bottom: 4px;
        }

        .login-card p {
            font-size: 13px;
            color: #6B7280;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #00796B;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #00796B;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #00796B;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #004D40;
        }

        .alert-error {
            background-color: #FEE2E2;
            color: #991B1B;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="main-header">
        <div class="header-content">
            <a href="index.html" class="logo-link">
                <img src="img/CPQD_Logo_Positivo_RGB.png" alt="Logo CPQD" class="logo-cpqd">
            </a>
            <span style="font-size: 12px; font-weight: 600; color: #00796B;">PAINEL ADMINISTRATIVO</span>
        </div>
    </header>

    <!-- FORMULÁRIO DE LOGIN -->
    <div class="login-wrapper">
        <div class="login-card">
            <img src="img/CPQD_Logo_Positivo_RGB.png" alt="CPQD 360" class="logo-cpqd">
            <h2>Área do Parceiro</h2>
            <p>Gerenciamento de Cardápios & Serviços</p>

            <div id="error-msg" class="alert-error">
                E-mail ou senha incorretos.
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">E-mail do Estabelecimento</label>
                    <input type="email" id="email" placeholder="ex: lecafe@cpqd.com.br" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha de Acesso</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login">Acessar Painel</button>
            </form>
        </div>
    </div>

    <!-- RODAPÉ COMPACTO -->
    <footer class="footer-bottom-bar" style="text-align: center; padding: 15px; background: #fff;">
        <p>Bússola da Jornada - CPQD 360 © All Rights Reserved</p>
    </footer>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Simulação de autenticação inicial para validação de fluxo
            if (email && password) {
                // Salva a sessão temporária
                sessionStorage.setItem('userLogado', email);
                window.location.href = 'painel-admin.html';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
